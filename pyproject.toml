[tool.poetry]
name = "telegram-bot-template"
version = "0.1.0"
description = "A reusable Telegram bot starter template"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
aiogram = ">=3.31,<4.0"
aiogram-dialog = ">=2.6,<3.0"
redis = ">=5,<9"
pydantic = ">=2.7,<3.0"
toml = ">=0.10,<0.11"
python-dotenv = ">=1.0,<2.0"
cachetools = ">=5,<7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
